name: Gerar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk VolumeRemoto.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VolumeRemoto-apk
          path: VolumeRemoto.apk

      - name: Publicar na página de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.ref_name == 'main' && 'main' || 'dev' }}
          name: Volume Remoto (APK)
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: VolumeRemoto.apk
          body: |
            Baixe o VolumeRemoto.apk e instale na central multimídia.
            Depois abra o app na central e use o endereço que ele mostrar no navegador do celular.
